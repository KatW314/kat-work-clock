<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7c9dc"><title>Kat's Work Clock</title><link rel="manifest" href="manifest.json">
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#34262e;background:#f9dbe7}*{box-sizing:border-box}body{margin:0;background:#f9dbe7}main{max-width:720px;margin:auto;padding:18px 16px 80px}.card{background:#fff9fb;border:1px solid #e9b9cd;border-radius:18px;padding:18px;margin-bottom:16px}.muted{color:#755f69;font-size:.9rem}h1{font-size:1.2rem;margin:0 0 4px}.timer{font:700 2.25rem ui-monospace,monospace;margin-top:8px}.warning{color:#8b2f46;font-weight:750}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cat{min-height:68px;border:2px solid #3f7d57;border-radius:14px;background:#fff9fb;color:#34262e;font-weight:750;font-size:1rem;padding:10px}.cat.active{background:#e8f3e9;border:3px solid #245f3b}input,select,button{font:inherit}input,select{width:100%;min-height:46px;border:1px solid #b78fa0;border-radius:10px;padding:10px;background:white}.row{display:flex;gap:9px;flex-wrap:wrap}.action{min-height:46px;border:1px solid #3f7d57;border-radius:10px;background:#fff9fb;padding:10px 14px;font-weight:650;color:#34262e}.primary{background:#3f7d57;color:white;border-color:#3f7d57}.danger{color:#9b2c2c}.tabs{display:flex;gap:8px;margin-bottom:14px}.tab{flex:1;min-height:44px;border:1px solid #3f7d57;background:#fff9fb;border-radius:10px;font-weight:700}.tab.active{background:#3f7d57;color:white}.hidden{display:none}.summary{display:grid;grid-template-columns:1fr auto;gap:7px 12px}.entry{border-top:1px solid #efd3df;padding:12px 0}.entry:first-child{border-top:0}.entry-title{font-weight:700}.entry-meta{font-size:.86rem;color:#755f69;margin-top:3px}.entry-actions{margin-top:8px;display:flex;gap:8px}.small{font-size:.82rem;padding:7px 10px;min-height:38px}.notice{font-size:.82rem;color:#755f69;text-align:center;margin-top:14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.toolbar select,.toolbar input{width:auto;flex:1;min-width:135px}.timeline{display:flex;height:34px;border-radius:10px;overflow:hidden;border:1px solid #d5a9ba;background:#fff;margin-top:12px}.timeline span{min-width:2px;border-right:1px solid rgba(255,255,255,.65)}.timeline-key{font-size:.78rem;color:#755f69;margin-top:8px;line-height:1.5}.callout{background:#fff0f5;border:1px solid #d69aaf;border-radius:12px;padding:11px;margin-top:12px}.split{display:flex;justify-content:space-between;gap:12px;align-items:center}.big-add{width:100%;margin-bottom:14px}.backup{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.backup button,.backup label{flex:1;min-width:140px}.file-label{display:flex;align-items:center;justify-content:center;cursor:pointer}.file-label input{display:none}@media(min-width:560px){.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body><main>
<div class="tabs"><button class="tab active" data-view="clock">Clock</button><button class="tab" data-view="history">History</button><button class="tab" data-view="reports">Reports</button></div>
<section id="clock">
<div class="card"><div class="muted">Currently tracking</div><h1 id="activeName">Nothing yet</h1><div id="activeNote" class="muted"></div><div id="timer" class="timer">00:00:00</div><div id="startedAt" class="muted"></div><div id="staleWarning" class="callout warning hidden">2+ hours on this task — still doing this?</div></div>
<div class="grid" id="categories"></div>
<div class="card" style="margin-top:16px"><label class="muted" for="note">Optional task note</label><input id="note" placeholder="What are you actually doing?"><div class="row" style="margin-top:10px"><button id="saveNote" class="action">Update note</button><button id="stopBtn" class="action primary">■ Stop tracking</button></div></div>
<div class="card"><div class="split"><strong>Today</strong><button id="clockAddManual" class="action small">+ Missed time</button></div><div id="todaySummary" class="summary" style="margin-top:10px"></div><div id="todayTimeline"></div></div>
</section>
<section id="history" class="hidden"><button id="addManual" class="action primary big-add">+ Add missed time</button><div class="card"><div class="toolbar"><strong>Time history</strong><input id="historyDate" type="date" aria-label="Filter history by date"><button id="clearHistoryDate" class="action small">All dates</button></div><div id="historyList" style="margin-top:8px"></div></div></section>
<section id="reports" class="hidden"><div class="card">
<div class="toolbar"><button class="action small range primary" data-range="today">Today</button><button class="action small range" data-range="yesterday">Yesterday</button><button class="action small range" data-range="week">This week</button><button class="action small range" data-range="month">This month</button><input id="reportDate" type="date" aria-label="Custom report date"></div>
<div class="toolbar" style="margin-top:12px"><select id="scope"><option value="all">All tracked time</option><option value="ctl">CTL work only</option></select></div>
<div id="reportSummary" class="summary" style="margin-top:16px"></div><div id="averageBox" class="callout"></div><div id="reportTimeline"></div>
<div class="backup"><button id="exportCsv" class="action">Export CSV</button><button id="backupJson" class="action">Backup data</button><label class="action file-label">Restore backup<input id="restoreJson" type="file" accept="application/json,.json"></label></div>
</div></section>
<div class="notice">Entries are stored locally on this phone. Use Backup data periodically so your history can be restored if your browser data is cleared or you replace your phone.</div>
</main><script>
const CATS=['EdDev','Classroom Services','Learning Center','Overall CTL','Personal Admin','Tori / Ad Hoc Admin','EdD','Danforth Staff Council'];
const CTL=new Set(['EdDev','Classroom Services','Learning Center','Overall CTL','Personal Admin','Tori / Ad Hoc Admin']);
const KEY='katWorkClockV1';let state=load(),range='today',customDate=null,scope='all',historyDate='';
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{active:null,entries:[]}}catch(e){return{active:null,entries:[]}}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}
const $=s=>document.querySelector(s),fmtTime=d=>new Date(d).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}),fmtDate=d=>new Date(d).toLocaleDateString([],{month:'short',day:'numeric'});function dur(ms){let m=Math.round(ms/60000);if(m<60)return m+'m';return Math.floor(m/60)+'h '+(m%60)+'m'}function esc(s){let d=document.createElement('div');d.textContent=s||'';return d.innerHTML}function id(){return crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random())}
function closeActive(end=Date.now()){if(!state.active)return;state.entries.push({id:id(),category:state.active.category,note:state.active.note||'',start:state.active.start,end});state.active=null;save()}
function start(category){let now=Date.now();closeActive(now);$('#note').value='';state.active={category,start:now,note:''};save();render();$('#note').focus()}
function renderCats(){$('#categories').innerHTML=CATS.map(c=>`<button class="cat ${state.active?.category===c?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>start(b.dataset.cat))}
function liveEntries(){let a=[...state.entries];if(state.active)a.push({category:state.active.category,note:state.active.note,start:state.active.start,end:Date.now(),live:true});return a}
function dayBounds(date){let d=new Date(date);let s=new Date(d.getFullYear(),d.getMonth(),d.getDate()),e=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1);return[s.getTime(),e.getTime()]}
function bounds(which){let n=new Date(),s,e;if(customDate)return dayBounds(customDate+'T12:00:00');if(which==='today')return dayBounds(n);if(which==='yesterday'){let y=new Date(n.getFullYear(),n.getMonth(),n.getDate()-1);return dayBounds(y)}if(which==='week'){let day=(n.getDay()+6)%7;s=new Date(n.getFullYear(),n.getMonth(),n.getDate()-day);e=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1);return[s.getTime(),e.getTime()]}s=new Date(n.getFullYear(),n.getMonth(),1);e=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1);return[s.getTime(),e.getTime()]}
function scoped(xs){return scope==='ctl'?xs.filter(x=>CTL.has(x.category)):xs}
function summarize(which){let [s,e]=bounds(which),o={};for(let x of scoped(liveEntries())){let a=Math.max(x.start,s),b=Math.min(x.end,e);if(b>a)o[x.category]=(o[x.category]||0)+(b-a)}return o}
function summaryHTML(o){let total=Object.values(o).reduce((a,b)=>a+b,0);if(!total)return '<span class="muted">No time tracked yet.</span><span></span>';return Object.entries(o).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<span>${esc(k)}</span><strong>${dur(v)} · ${Math.round(v/total*100)}%</strong>`).join('')+`<span style="border-top:1px solid #d5a9ba;padding-top:8px">Total</span><strong style="border-top:1px solid #d5a9ba;padding-top:8px">${dur(total)}</strong>`}
function entriesForDay(date){let [s,e]=dayBounds(date);return scoped(liveEntries()).filter(x=>x.end>s&&x.start<e).map(x=>({...x,start:Math.max(x.start,s),end:Math.min(x.end,e)})).sort((a,b)=>a.start-b.start)}
function timelineHTML(date){let xs=entriesForDay(date);if(!xs.length)return '';let first=xs[0].start,last=xs[xs.length-1].end,total=Math.max(1,last-first);let palette=['#5b8f6b','#b56f8b','#6f879f','#8d7aa8','#9b865b','#628b87','#b07171','#7f8b62'];let bars=xs.map(x=>`<span title="${esc(x.category)} ${esc(x.note)}" style="width:${Math.max(.5,(x.end-x.start)/total*100)}%;background:${palette[Math.max(0,CATS.indexOf(x.category))%palette.length]}"></span>`).join('');let key=xs.map(x=>`${fmtTime(x.start)} ${esc(x.category)}${x.note?' · '+esc(x.note):''}`).join(' &nbsp;•&nbsp; ');return `<div class="timeline" aria-label="Daily timeline">${bars}</div><div class="timeline-key">${key}</div>`}
function renderHistory(){let xs=[...state.entries].sort((a,b)=>b.start-a.start);if(historyDate){let [s,e]=dayBounds(historyDate+'T12:00:00');xs=xs.filter(x=>x.end>s&&x.start<e)}$('#historyList').innerHTML=xs.length?xs.slice(0,200).map(x=>`<div class="entry"><div class="entry-title">${esc(x.category)}</div><div>${esc(x.note)}</div><div class="entry-meta">${fmtDate(x.start)} · ${fmtTime(x.start)}–${fmtTime(x.end)} · ${dur(x.end-x.start)}</div><div class="entry-actions"><button class="action small edit" data-id="${x.id}">Edit</button><button class="action small danger del" data-id="${x.id}">Delete</button></div></div>`).join(''):'<div class="muted">No completed entries for this view.</div>';document.querySelectorAll('.del').forEach(b=>b.onclick=()=>{if(confirm('Delete this entry?')){state.entries=state.entries.filter(x=>x.id!==b.dataset.id);save();render()}});document.querySelectorAll('.edit').forEach(b=>b.onclick=()=>editEntry(b.dataset.id))}
function editEntry(idv){let x=state.entries.find(x=>x.id===idv);if(!x)return;let cat=prompt('Category:',x.category);if(cat===null)return;let note=prompt('Task note:',x.note||'');if(note===null)return;let mins=prompt('Duration in minutes:',Math.round((x.end-x.start)/60000));if(mins===null)return;mins=Number(mins);if(!Number.isFinite(mins)||mins<0)return alert('Please enter a valid number of minutes.');x.category=cat.trim()||x.category;x.note=note.trim();x.end=x.start+mins*60000;save();render()}
function addManual(){let cat=prompt('Category (example: EdDev):','EdDev');if(!cat)return;let mins=Number(prompt('How many minutes?','30'));if(!Number.isFinite(mins)||mins<=0)return alert('Please enter a valid number of minutes.');let note=prompt('Task note (optional):','')||'';let end=Date.now(),start=end-mins*60000;state.entries.push({id:id(),category:cat.trim(),note:note.trim(),start,end});save();render()}
function weeklyAverage(){let xs=scoped(state.entries);if(!xs.length)return 'Weekly average will appear after you have tracked some completed work.';let starts=xs.map(x=>x.start),min=Math.min(...starts),now=Date.now(),weeks=Math.max(1,(now-min)/(7*86400000));let total=xs.reduce((n,x)=>n+(x.end-x.start),0);return `Average across your tracked history: <strong>${dur(total/weeks)} per week</strong> (${scope==='ctl'?'CTL work only':'all tracked time'}).`}
function render(){renderCats();$('#activeName').textContent=state.active?.category||'Nothing yet';$('#activeNote').textContent=state.active?.note||'';$('#startedAt').textContent=state.active?'Started '+fmtTime(state.active.start):'';$('#note').value=state.active?.note||$('#note').value;$('#todaySummary').innerHTML=summaryHTML((()=>{let old=customDate,oldScope=scope;customDate=null;scope='all';let x=summarize('today');customDate=old;scope=oldScope;return x})());$('#todayTimeline').innerHTML=timelineHTML(new Date());$('#reportSummary').innerHTML=summaryHTML(summarize(range));$('#averageBox').innerHTML=weeklyAverage();let reportDay=customDate?new Date(customDate+'T12:00:00'):(range==='yesterday'?new Date(Date.now()-86400000):new Date());$('#reportTimeline').innerHTML=(range==='today'||range==='yesterday'||customDate)?timelineHTML(reportDay):'';renderHistory();tick()}
function tick(){if(state.active){let s=Math.floor((Date.now()-state.active.start)/1000);$('#timer').textContent=[Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(x=>String(x).padStart(2,'0')).join(':');$('#staleWarning').classList.toggle('hidden',s<7200)}else{$('#timer').textContent='00:00:00';$('#staleWarning').classList.add('hidden')}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));['clock','history','reports'].forEach(v=>$('#'+v).classList.toggle('hidden',v!==b.dataset.view));render()});$('#saveNote').onclick=()=>{if(state.active){state.active.note=$('#note').value.trim();save();render()}};$('#stopBtn').onclick=()=>{closeActive();$('#note').value='';render()};$('#addManual').onclick=addManual;$('#clockAddManual').onclick=addManual;$('#historyDate').onchange=e=>{historyDate=e.target.value;renderHistory()};$('#clearHistoryDate').onclick=()=>{historyDate='';$('#historyDate').value='';renderHistory()};document.querySelectorAll('.range').forEach(b=>b.onclick=()=>{range=b.dataset.range;customDate=null;$('#reportDate').value='';document.querySelectorAll('.range').forEach(x=>x.classList.toggle('primary',x===b));render()});$('#reportDate').onchange=e=>{customDate=e.target.value||null;document.querySelectorAll('.range').forEach(x=>x.classList.remove('primary'));render()};$('#scope').onchange=e=>{scope=e.target.value;render()};
$('#exportCsv').onclick=()=>{let rows=[['Date','Category','Task','Start','End','Minutes'],...state.entries.map(x=>[new Date(x.start).toLocaleDateString(),x.category,x.note||'',new Date(x.start).toLocaleString(),new Date(x.end).toLocaleString(),Math.round((x.end-x.start)/60000)])];download(rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n'),'kat-work-clock.csv','text/csv')};function download(data,name,type){let blob=new Blob([data],{type}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}$('#backupJson').onclick=()=>download(JSON.stringify({version:2,exportedAt:new Date().toISOString(),state},null,2),'kat-work-clock-backup.json','application/json');$('#restoreJson').onchange=e=>{let f=e.target.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result),incoming=d.state||d;if(!incoming||!Array.isArray(incoming.entries))throw 0;if(confirm('Restore this backup? This will replace the Work Clock data currently stored on this phone.')){state=incoming;save();render();alert('Backup restored.')}}catch(err){alert('That file does not look like a valid Work Clock backup.')}e.target.value=''};r.readAsText(f)};
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});render();setInterval(()=>{tick();if(state.active){$('#todaySummary').innerHTML=summaryHTML((()=>{let old=customDate,oldScope=scope;customDate=null;scope='all';let x=summarize('today');customDate=old;scope=oldScope;return x})())}},1000);
</script></body></html>
