<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e"><title>Kat's Work Clock</title>
<link rel="manifest" href="manifest.json">
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#17202a;background:#f7f8f8}*{box-sizing:border-box}body{margin:0}main{max-width:720px;margin:auto;padding:18px 16px 80px}.card{background:white;border:1px solid #d9dfdf;border-radius:18px;padding:18px;margin-bottom:16px}.muted{color:#687576;font-size:.9rem}h1{font-size:1.15rem;margin:0 0 4px}.timer{font:700 2.2rem ui-monospace,monospace;margin-top:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cat{min-height:72px;border:1px solid #ccd5d5;border-radius:14px;background:white;font-weight:700;font-size:1rem;padding:10px}.cat.active{background:#d9f2ee;border:2px solid #0f766e}.label{font-size:.8rem;color:#687576;display:block;margin-top:3px;font-weight:400}input,select,button{font:inherit}input,select{width:100%;min-height:46px;border:1px solid #cbd5d5;border-radius:10px;padding:10px;background:white}.row{display:flex;gap:9px;flex-wrap:wrap}.action{min-height:46px;border:1px solid #cbd5d5;border-radius:10px;background:white;padding:10px 14px;font-weight:650}.primary{background:#0f766e;color:white;border-color:#0f766e}.danger{color:#9b2c2c}.tabs{display:flex;gap:8px;margin-bottom:14px}.tab{flex:1;min-height:44px;border:1px solid #ccd5d5;background:white;border-radius:10px;font-weight:700}.tab.active{background:#17202a;color:white}.hidden{display:none}.summary{display:grid;grid-template-columns:1fr auto;gap:7px 12px}.entry{border-top:1px solid #e3e7e7;padding:12px 0}.entry:first-child{border-top:0}.entry-title{font-weight:700}.entry-meta{font-size:.86rem;color:#687576;margin-top:3px}.entry-actions{margin-top:8px;display:flex;gap:8px}.small{font-size:.82rem;padding:7px 10px;min-height:36px}.notice{font-size:.82rem;color:#687576;text-align:center;margin-top:14px}@media(min-width:560px){.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body><main>
<div class="tabs"><button class="tab active" data-view="clock">Clock</button><button class="tab" data-view="history">History</button><button class="tab" data-view="reports">Reports</button></div>
<section id="clock">
<div class="card"><div class="muted">Currently tracking</div><h1 id="activeName">Nothing yet</h1><div id="activeNote" class="muted"></div><div id="timer" class="timer">00:00:00</div><div id="startedAt" class="muted"></div></div>
<div class="grid" id="categories"></div>
<div class="card" style="margin-top:16px"><label class="muted" for="note">Optional task note</label><input id="note" placeholder="What are you actually doing?"><div class="row" style="margin-top:10px"><button id="saveNote" class="action">Update note</button><button id="breakBtn" class="action">☕ Break / Personal</button><button id="doneBtn" class="action primary">■ Done for day</button></div></div>
<div class="card"><strong>Today</strong><div id="todaySummary" class="summary" style="margin-top:10px"></div></div>
</section>
<section id="history" class="hidden"><div class="card"><div class="row" style="justify-content:space-between;align-items:center"><strong>Time history</strong><button id="addManual" class="action small primary">+ Add missed time</button></div><div id="historyList" style="margin-top:8px"></div></div></section>
<section id="reports" class="hidden"><div class="card"><div class="row"><button class="action small range primary" data-range="today">Today</button><button class="action small range" data-range="week">This week</button><button class="action small range" data-range="month">This month</button></div><div id="reportSummary" class="summary" style="margin-top:16px"></div><div class="row" style="margin-top:18px"><button id="exportCsv" class="action">Export CSV</button></div></div></section>
<div class="notice">Your entries are stored only in this browser on this phone. Export CSV periodically as a backup.</div>
</main>
<script>
const CATS=[['EdDev','Educational Development'],['Classroom Services','CS'],['Learning Center','Learning Center'],['Overall CTL','Overall CTL'],['Personal Admin','expenses, travel, etc.'],['Tori / Ad Hoc Admin','ad hoc support'],['EdD','doctoral work'],['Danforth Staff Council','Staff Council']];
const KEY='katWorkClockV1';let state=load();let range='today';
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{active:null,entries:[]}}catch(e){return{active:null,entries:[]}}}function save(){localStorage.setItem(KEY,JSON.stringify(state)}
const $=s=>document.querySelector(s),fmtTime=d=>new Date(d).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}),fmtDate=d=>new Date(d).toLocaleDateString([],{month:'short',day:'numeric'});function dur(ms){let m=Math.round(ms/60000);if(m<60)return m+'m';return Math.floor(m/60)+'h '+(m%60)+'m'}function esc(s){let d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function closeActive(end=Date.now()){if(!state.active)return;state.entries.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),category:state.active.category,note:state.active.note||'',start:state.active.start,end});state.active=null;save()}
function start(category){let now=Date.now();closeActive(now);$('#note').value='';state.active={category,start:now,note:''};save();render();$('#note').focus()}
function renderCats(){$('#categories').innerHTML=CATS.map(([c,s])=>`<button class="cat ${state.active?.category===c?'active':''}" data-cat="${esc(c)}">${esc(c)}<span class="label">${esc(s)}</span></button>`).join('');document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>start(b.dataset.cat))}
function liveEntries(){let a=[...state.entries];if(state.active)a.push({category:state.active.category,note:state.active.note,start:state.active.start,end:Date.now(),live:true});return a}
function bounds(which){let n=new Date(),s,e=new Date(n);if(which==='today'){s=new Date(n.getFullYear(),n.getMonth(),n.getDate())}else if(which==='week'){let day=(n.getDay()+6)%7;s=new Date(n.getFullYear(),n.getMonth(),n.getDate()-day)}else{s=new Date(n.getFullYear(),n.getMonth(),1)}return[s.getTime(),e.getTime()]}
function summarize(which){let [s,e]=bounds(which),o={};for(let x of liveEntries()){let a=Math.max(x.start,s),b=Math.min(x.end,e);if(b>a)o[x.category]=(o[x.category]||0)+(b-a)}return o}
function summaryHTML(o){let total=Object.values(o).reduce((a,b)=>a+b,0);if(!total)return '<span class="muted">No time tracked yet.</span><span></span>';return Object.entries(o).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<span>${esc(k)}</span><strong>${dur(v)} · ${Math.round(v/total*100)}%</strong>`).join('')+`<span style="border-top:1px solid #ddd;padding-top:8px">Total</span><strong style="border-top:1px solid #ddd;padding-top:8px">${dur(total)}</strong>`}
function renderHistory(){let xs=[...state.entries].sort((a,b)=>b.start-a.start);$('#historyList').innerHTML=xs.length?xs.slice(0,100).map(x=>`<div class="entry"><div class="entry-title">${esc(x.category)}</div><div>${esc(x.note)}</div><div class="entry-meta">${fmtDate(x.start)} · ${fmtTime(x.start)}–${fmtTime(x.end)} · ${dur(x.end-x.start)}</div><div class="entry-actions"><button class="action small edit" data-id="${x.id}">Edit</button><button class="action small danger del" data-id="${x.id}">Delete</button></div></div>`).join(''):'<div class="muted">No completed entries yet.</div>';document.querySelectorAll('.del').forEach(b=>b.onclick=()=>{if(confirm('Delete this entry?')){state.entries=state.entries.filter(x=>x.id!==b.dataset.id);save();render()}});document.querySelectorAll('.edit').forEach(b=>b.onclick=()=>editEntry(b.dataset.id))}
function editEntry(id){let x=state.entries.find(x=>x.id===id);if(!x)return;let cat=prompt('Category:',x.category);if(cat===null)return;let note=prompt('Task note:',x.note||'');if(note===null)return;let mins=prompt('Duration in minutes:',Math.round((x.end-x.start)/60000));if(mins===null)return;mins=Number(mins);if(!Number.isFinite(mins)||mins<0)return alert('Please enter a valid number of minutes.');x.category=cat.trim()||x.category;x.note=note.trim();x.end=x.start+mins*60000;save();render()}
function addManual(){let cat=prompt('Category (example: EdDev):','EdDev');if(!cat)return;let mins=Number(prompt('How many minutes?','30'));if(!Number.isFinite(mins)||mins<=0)return alert('Please enter a valid number of minutes.');let note=prompt('Task note (optional):','')||'';let end=Date.now(),start=end-mins*60000;state.entries.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),category:cat.trim(),note:note.trim(),start,end});save();render()}
function render(){renderCats();$('#activeName').textContent=state.active?.category||'Nothing yet';$('#activeNote').textContent=state.active?.note||'';$('#startedAt').textContent=state.active?'Started '+fmtTime(state.active.start):'';$('#note').value=state.active?.note||$('#note').value;$('#todaySummary').innerHTML=summaryHTML(summarize('today'));$('#reportSummary').innerHTML=summaryHTML(summarize(range));renderHistory()}
function tick(){if(state.active){let s=Math.floor((Date.now()-state.active.start)/1000);$('#timer').textContent=[Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(x=>String(x).padStart(2,'0')).join(':');$('#todaySummary').innerHTML=summaryHTML(summarize('today'));if(!$('#reports').classList.contains('hidden'))$('#reportSummary').innerHTML=summaryHTML(summarize(range))}else $('#timer').textContent='00:00:00'}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));['clock','history','reports'].forEach(v=>$('#'+v).classList.toggle('hidden',v!==b.dataset.view));render()});$('#saveNote').onclick=()=>{if(state.active){state.active.note=$('#note').value.trim();save();render()}};$('#breakBtn').onclick=()=>{closeActive();$('#note').value='';render()};$('#doneBtn').onclick=()=>{closeActive();$('#note').value='';render()};$('#addManual').onclick=addManual;document.querySelectorAll('.range').forEach(b=>b.onclick=()=>{range=b.dataset.range;document.querySelectorAll('.range').forEach(x=>x.classList.toggle('primary',x===b));render()});$('#exportCsv').onclick=()=>{let rows=[['Date','Category','Task','Start','End','Minutes'],...state.entries.map(x=>[new Date(x.start).toLocaleDateString(),x.category,x.note||'',new Date(x.start).toLocaleString(),new Date(x.end).toLocaleString(),Math.round((x.end-x.start)/60000)])];let csv=rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n'),blob=new Blob([csv],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kat-work-clock.csv';a.click();URL.revokeObjectURL(a.href)};if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});render();setInterval(tick,1000);tick();
</script></body></html>
